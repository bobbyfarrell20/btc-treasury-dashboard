name: Refresh data & deploy dashboard
on:
  schedule:
    # Cron is UTC. Cover pre-market (4:00 AM ET), regular hours, and after-hours (to 8:00 PM ET)
    # in both EST (UTC-5) and EDT (UTC-4) without using any bot tokens:
    #   4:00 AM ET = 09:00 UTC EST / 08:00 UTC EDT
    #   8:00 PM ET = 01:00 UTC EST / 00:00 UTC EDT next calendar day
    # Weekday 08:00–23:45 UTC plus 00:00–01:45 UTC Tue–Sat covers that window.
    # Weekend job kept for BTC + prediction markets. Quote misses are skipped, not fatal.
    - cron: "*/15 8-23 * * 1-5"   # weekdays every 15 min ~3/4 AM–6/7 PM ET (pre + regular + early AH)
    - cron: "*/15 0-1 * * 2-6"    # Tue–Sat 00:00–01:45 UTC = Mon–Fri after-hours tail to ~8/9 PM ET
    - cron: "15 14 * * 0,6"       # weekends: BTC + prediction markets keep moving
  workflow_dispatch:
  repository_dispatch:
    types: [dashboard-refresh]
  push:
    branches: [main]
    paths-ignore: ["data/**", "signals.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Update data and signals
        env:
          SEC_USER_AGENT: "BtcTreasuryDashboard research contact@example.com"
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data signals.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
