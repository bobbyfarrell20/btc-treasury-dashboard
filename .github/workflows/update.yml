name: Refresh data & deploy dashboard
on:
  schedule:
    - cron: "15 22 * * 1-5"   # weekdays ~6:15 PM ET (EDT) / 5:15 PM ET (EST), after the US close
    - cron: "15 14 * * 0,6"   # weekends: BTC + prediction markets keep moving
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "signals.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Update data and signals
        env:
          SEC_USER_AGENT: "BtcTreasuryDashboard research contact@example.com"
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data signals.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
